name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify plugin
        run: ./gradlew clean build --no-daemon

      - name: Collect plugin jar
        shell: bash
        run: |
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name 'UltimateTeams-*.jar' \
            ! -name '*-api.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp '{}' artifact/ \;
          test "$(find artifact -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: UltimateTeams-${{ github.sha }}
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 30
